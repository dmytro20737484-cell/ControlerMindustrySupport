name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build PC + Android jar
        run: gradle deploy --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ControllerMindustrySupport
          path: build/libs/ControllerMindustrySupport.jar
