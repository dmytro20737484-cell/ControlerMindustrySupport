name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          for z in *.zip; do unzip -o "$z"; done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Find project folder
        run: |
          F=$(find . -name build.gradle -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "build.gradle not found in repo"; exit 1; fi
          echo "MOD_DIR=$(dirname "$F")" >> "$GITHUB_ENV"

      - name: Build PC + Android jar
        working-directory: ${{ env.MOD_DIR }}
        run: gradle deploy --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ControllerMindustrySupport
          path: ${{ env.MOD_DIR }}/build/libs/ControllerMindustrySupport.jar
